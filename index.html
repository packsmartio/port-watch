<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PORT WATCH</title>
<style>
:root{--bg:#07111f;--card:#101d2d;--card2:#14243a;--text:#f4f7fb;--muted:#91a4bb;--line:#233750}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1625);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:22px 14px 40px}
h1{font-size:28px;letter-spacing:.08em;margin:8px 0 3px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.head{display:flex;align-items:center;padding:14px;gap:10px;cursor:pointer}.flag{font-size:23px}.name{flex:1}.name b{display:block;font-size:16px}.name small{color:var(--muted)}
.badge{font-size:12px;border-radius:99px;padding:6px 9px;background:#25364c}.ok{background:#143d2c}.warn{background:#4a3917}.hot{background:#4a251c}.off{background:#293341;color:#a9b5c4}
.detail{display:none;border-top:1px solid var(--line);padding:13px 14px;background:var(--card2);font-size:13px;line-height:1.65}.detail.show{display:block}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #21344d;padding:6px 0}.row:last-child{border:0}.muted{color:var(--muted)}
.note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.55}
button{width:100%;margin-top:12px;border:0;border-radius:13px;padding:12px;background:#e8eef6;color:#0a1421;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>PORT WATCH</h1>
<div class="sub">Global container port monitor · Prototype</div>

<div class="summary">
 <div class="stat"><b>9</b><span>監視対象港</span></div>
 <div class="stat"><b>0</b><span>実データ接続</span></div>
 <div class="stat"><b>06:00</b><span>更新目標 JST</span></div>
</div>

<div id="ports"></div>
<button onclick="document.getElementById('about').classList.toggle('show')">この試作品について</button>
<div id="about" class="detail">
これは画面・操作確認用の最初の試作品です。架空の船舶数は表示していません。
次段階で無料の公開データを接続し、取得できた港から船舶数・入出港・混雑指標を表示します。
</div>
<div class="note">※ 現在はUI試作版。数値を捏造しないため、実データ未接続の港は「未接続」と表示しています。</div>
</div>
<script>
const ports=[
["🇨🇳","Shanghai","上海"],["🇨🇳","Ningbo","寧波"],["🇨🇳","Shenzhen","深圳"],
["🇸🇬","Singapore","シンガポール"],["🇰🇷","Busan","釜山"],["🇹🇼","Kaohsiung","高雄"],
["🇩🇪","Hamburg","ハンブルク"],["🇺🇸","Los Angeles","ロサンゼルス"],["🇺🇸","Long Beach","ロングビーチ"]
];
const root=document.getElementById("ports");
ports.forEach((p,i)=>{
 const el=document.createElement("div"); el.className="card";
 el.innerHTML=`<div class="head" onclick="this.nextElementSibling.classList.toggle('show')">
 <div class="flag">${p[0]}</div><div class="name"><b>${p[1]}</b><small>${p[2]}</small></div>
 <div class="badge off">未接続</div></div>
 <div class="detail">
 <div class="row"><span class="muted">港周辺コンテナ船</span><b>—</b></div>
 <div class="row"><span class="muted">停泊・低速船</span><b>—</b></div>
 <div class="row"><span class="muted">混雑判定</span><b>データ待ち</b></div>
 <div class="row"><span class="muted">最終更新</span><b>—</b></div>
 </div>`;
 root.appendChild(el);
});
</script>
</body></html>
